repos:
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.1
    hooks:
      - id: mypy
        name: mypy lab_01
        files: ^lab_01/
        args: [--config-file=lab_01/pyproject.toml]
        additional_dependencies: [pytest]

      - id: mypy
        name: mypy lab_02
        files: ^lab_02/
        args: [--config-file=lab_02/pyproject.toml]
        additional_dependencies: [pytest]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff-check
        name: ruff lab_01
        files: ^lab_01/
        args: [--config=lab_01/pyproject.toml]

      - id: ruff-check
        name: ruff lab_02
        files: ^lab_02/
        args: [--config=lab_02/pyproject.toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
